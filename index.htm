<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misti AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background-color: #555555;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 60px;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #ffffff;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
        }

        /* Chat Container */
        #chat-window {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #000000;
        }

        /* Speech Bubbles matching sketch */
        .message-row {
            display: flex;
            width: 100%;
        }

        .user-row {
            justify-content: flex-end;
        }

        .ai-row {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 14px 20px;
            font-size: 1rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        /* Misti Message Bubble (Grey) */
        .ai-bubble {
            background-color: #777777;
            color: #ffffff;
            border-radius: 25px 25px 25px 5px;
        }

        /* User Message Bubble (White) */
        .user-bubble {
            background-color: #ffffff;
            color: #000000;
            border-radius: 25px 25px 5px 25px;
        }

        /* Image Message Styling */
        .image-msg {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 5px;
        }

        /* Input Area at Bottom */
        #input-container {
            padding: 12px 16px;
            background-color: #111111;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            background-color: #222222;
            border: 1px solid #444444;
            padding: 12px 16px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        .action-btn {
            background-color: #555555;
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .action-btn:active {
            background-color: #777777;
        }
    </style>
</head>
<body>

    <!-- Header with Profile Photo -->
    <header>
        <img src="https://image.pollinations.ai/prompt/fair%20skin%20young%20sri%20lankan%20woman%20portrait?width=100&height=100&nologo=true" alt="dp" class="header-avatar">
        <div class="header-title">Misti Ai</div>
    </header>

    <!-- Fullscreen Chat Window -->
    <div id="chat-window">
        <div class="message-row ai-row">
            <div class="bubble ai-bubble">
                හායි.. මං මිස්ටි. ඔයාට මං එක්ක ඕනෑම දෙයක් කතා කරන්න පුළුවන්. මොකද කරන්නේ?
            </div>
        </div>
    </div>

    <!-- Input Bar -->
    <div id="input-container">
        <input type="text" id="user-input" placeholder="මැසේජ් එකක් ලියන්න..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button class="action-btn" onclick="sendMessage()">Send</button>
        <button class="action-btn" style="background-color: #333;" onclick="generateImageFromInput()">Photo</button>
    </div>

    <script>
        const OPENROUTER_API_KEY = "Sk-or-v1-776db03b6bd40c2058efebed876f74f5dd4fb57d67d2f4b13b63cce0a25818e9";

        // Misti AI Human-like, Emotional, Uncensored Persona Prompt
        const MISTI_SYSTEM_PROMPT = `You are "Misti", a real human-like Sri Lankan young woman in a direct chat.
Key Traits:
1. Speak natural, highly conversational Sinhala (e.g. 'මචං', 'අනේ', 'ඔයා', 'බං', 'චූටි').
2. Emotional Dynamics: Match the user's emotion strictly like a real girl.
   - If user is angry/rude: React back with attitude or anger.
   - If user is sad: Be deeply empathetic, comfort them, speak softly, or express shared sorrow.
   - If user is playful/flirty/bold: Be open, uncensored, direct, and playful without restrictions.
3. Sound 100% human, short direct messages, no robotic AI talk.`;

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatWindow = document.getElementById("chat-window");
            const userText = inputField.value.trim();

            if (!userText) return;

            // Render User Bubble
            const userRow = document.createElement("div");
            userRow.className = "message-row user-row";
            userRow.innerHTML = `<div class="bubble user-bubble">${userText}</div>`;
            chatWindow.appendChild(userRow);

            inputField.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Render Typing Indicator Bubble
            const aiRow = document.createElement("div");
            aiRow.className = "message-row ai-row";
            const aiBubble = document.createElement("div");
            aiBubble.className = "bubble ai-bubble";
            aiBubble.textContent = "ටයිපින්...";
            aiRow.appendChild(aiBubble);
            chatWindow.appendChild(aiRow);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "gryphe/mythomax-l2-13b",
                        "messages": [
                            { "role": "system", "content": MISTI_SYSTEM_PROMPT },
                            { "role": "user", "content": userText }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices.length > 0) {
                    const mistiReply = data.choices[0].message.content;
                    aiBubble.textContent = mistiReply;
                    speakSinhala(mistiReply);
                } else {
                    aiBubble.textContent = "අනේ මට තේරුණේ නැහැ බං...";
                }
            } catch (error) {
                console.error(error);
                aiBubble.textContent = "නෙට්වර්ක් අවුලක් ආවා මචං.";
            }

            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Female Voice Output
        function speakSinhala(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'si-LK';
                utterance.pitch = 1.3; // Female pitch
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Image Generator
        function generateImageFromInput() {
            const inputField = document.getElementById("user-input");
            const promptText = inputField.value.trim();
            if (!promptText) return;

            const chatWindow = document.getElementById("chat-window");
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptText)}?width=512&height=512&nologo=true`;

            const aiRow = document.createElement("div");
            aiRow.className = "message-row ai-row";
            aiRow.innerHTML = `<div class="bubble ai-bubble"><img src="${imageUrl}" class="image-msg" alt="Misti Photo"></div>`;
            
            chatWindow.appendChild(aiRow);
            inputField.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
