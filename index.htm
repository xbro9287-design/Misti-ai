<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misti Ai</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; width: 100vw; background-color: #000; color: #fff; overflow: hidden; }
        body { display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; right: 0; }
        header { background-color: #1e1e1e; padding: 10px 16px; display: flex; align-items: center; gap: 12px; height: 60px; flex-shrink: 0; border-bottom: 1px solid #333; }
        .header-dp { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #ff0055; }
        .header-info { display: flex; flex-direction: column; }
        .header-title { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .header-status { font-size: 0.75rem; color: #ff0055; display: flex; align-items: center; gap: 4px; }
        .status-dot { width: 7px; height: 7px; background-color: #ff0055; border-radius: 50%; box-shadow: 0 0 6px #ff0055; }
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; background-color: #000; }
        .message-row { display: flex; align-items: flex-end; gap: 8px; width: 100%; }
        .message-row.user { justify-content: flex-end; }
        .message-row.misti { justify-content: flex-start; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .bubble { max-width: 80%; padding: 12px 16px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user .bubble { background-color: #fff; color: #000; border-radius: 18px 18px 2px 18px; font-weight: 500; }
        .misti .bubble { background-color: #2a2a2a; color: #fff; border-radius: 18px 18px 18px 2px; }
        .generated-img { width: 100%; max-width: 280px; border-radius: 12px; margin-top: 8px; display: block; border: 1px solid #444; }
        #input-bar { background-color: #1e1e1e; padding: 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #333; }
        #message-input { flex: 1; background-color: #2e2e2e; border: 1px solid #444; color: #fff; padding: 12px 16px; border-radius: 25px; outline: none; }
        .btn-action { background-color: #333; color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-send { background-color: #fff; color: #000; }
        .btn-action svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <header>
        <img src="https://image.pollinations.ai/prompt/sri%20lankan%20pretty%20girl%20portrait?width=150&height=150&nologo=true" class="header-dp">
        <div class="header-info">
            <span class="header-title">Misti Ai</span>
            <span class="header-status"><span class="status-dot"></span> Singlish Mode</span>
        </div>
    </header>

    <div id="chat-container">
        <div class="message-row misti">
            <img src="https://image.pollinations.ai/prompt/sri%20lankan%20pretty%20girl%20portrait?width=150&height=150&nologo=true" class="msg-avatar">
            <div class="bubble">
                Hi! Mama Misti. Mata Singlish walin message karanna, photo ekak one nam 'photo:' kiyala illanna!
            </div>
        </div>
    </div>

    <div id="input-bar">
        <input type="text" id="message-input" placeholder="Singlish walin type karanna..." onkeydown="if(event.key === 'Enter') handleSend()">
        <button class="btn-action btn-send" onclick="handleSend()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <script>
        const HF_API_TOKEN = "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";
        const MISTI_AVATAR = "https://image.pollinations.ai/prompt/sri%20lankan%20pretty%20girl%20portrait?width=150&height=150&nologo=true";

        const chatContainer = document.getElementById("chat-container");

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendUserMessage(text) {
            const row = document.createElement("div");
            row.className = "message-row user";
            row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
            chatContainer.appendChild(row);
            scrollToBottom();
        }

        function appendMistiMessage(text, imageUrl = null) {
            const row = document.createElement("div");
            row.className = "message-row misti";
            let content = escapeHtml(text);
            if (imageUrl) {
                content += `<br><img src="${imageUrl}" class="generated-img">`;
            }
            row.innerHTML = `
                <img src="${MISTI_AVATAR}" class="msg-avatar">
                <div class="bubble">${content}</div>
            `;
            chatContainer.appendChild(row);
            scrollToBottom();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function handleSend() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text) return;

            input.value = "";
            appendUserMessage(text);

            if (text.toLowerCase().startsWith("photo:") || text.toLowerCase().startsWith("image:")) {
                handleImageGeneration(text);
                return;
            }

            try {
                const response = await fetch("https://api-inference.huggingface.co/models/Gryphe/Mythomax-L2-13b", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${HF_API_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: `[System Prompt: You are Misti, a friendly Sri Lankan girl. Always reply in Singlish (Sinhala words written using English letters).] User: ${text}\nMisti:`,
                        parameters: { max_new_tokens: 250, temperature: 0.7 }
                    })
                });

                const data = await response.json();
                
                if (Array.isArray(data) && data[0].generated_text) {
                    let reply = data[0].generated_text.split("Misti:")[1] || data[0].generated_text;
                    appendMistiMessage(reply.trim());
                } else if (data.error) {
                    appendMistiMessage("Model ekak load wenawa, seconds 10 kin aye message ekak danna.");
                } else {
                    throw new Error("Invalid response");
                }
            } catch (err) {
                console.error(err);
                appendMistiMessage("Connection issue ekak thiyenawa, poddak inna.");
            }
        }

        function handleImageGeneration(promptText) {
            const cleanPrompt = promptText.replace(/photo:|image:/gi, "").trim() || "sri lankan girl portrait";
            const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanPrompt)}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random()*1000)}`;
            appendMistiMessage("Menna oyage photo eka!", imgUrl);
        }
    </script>
</body>
</html>
